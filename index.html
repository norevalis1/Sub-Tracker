<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscription Tracker</title>

<!--
  VERSION 2 - WHAT'S NEW (search for the "NEW:" comments to find each change)
  1. Cozy neutral colors (see the COLORS section in the CSS)
  2. Category dropdown in the form
  3. Edit button on every subscription
  4. "Spending by category" bars under your total

  FILE LAYOUT: <style> = looks, <body> = structure, <script> = behavior
-->

<!-- SECURITY: this page only loads files from this site and never sends data anywhere.
     Your subscriptions stay in this browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script>
  // Refuse to run inside someone else's page (stops "clickjacking" tricks on the Delete buttons).
  // GitHub Pages can't send the header that normally does this, so we do it here.
  if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.style.display = "none"; } }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f2a24'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23e9e3d9'%3E$%3C/text%3E%3C/svg%3E">
<!-- The font is served from this site (fonts/), Latin letters only, so text shows sooner. -->
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>
  @font-face {
    font-family: "Bricolage Grotesque"; font-style: normal; font-display: swap;
    font-weight: 400 800;
    src: url(fonts/bricolage-grotesque-latin.woff2) format("woff2");
  }
  /* ---------- COLORS ----------
     NEW: warm, cozy neutrals (oatmeal, walnut, soft charcoal).
     To re-theme the whole app, change only the values in this block. */
  :root {
    --bg: #e9e3d9;        /* oatmeal page background */
    --card: #f6f2ea;      /* soft linen boxes */
    --ink: #2f2a24;       /* charcoal-brown text */
    --muted: #7a6f62;     /* taupe secondary text */
    --line: #d6cdbf;      /* sand borders */
    --accent: #7a5c45;    /* walnut: buttons, totals, bars */
    --accent-ink: #f6f2ea;/* text on walnut */
    --warn: #a8641f;      /* amber: "renews soon" */
    --danger: #a63d32;    /* brick: delete */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Dark mode (automatic when your phone is in dark mode) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b17; --card: #2a2520; --ink: #efe8dc; --muted: #a89d8e;
      --line: #3d362e; --accent: #d3a97f; --accent-ink: #231c15;
      --warn: #e0a458; --danger: #e07b6e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1b17; --card: #2a2520; --ink: #efe8dc; --muted: #a89d8e;
    --line: #3d362e; --accent: #d3a97f; --accent-ink: #231c15;
    --warn: #e0a458; --danger: #e07b6e;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  /* ---------- BASE ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.6rem; font-weight: 800; margin: 8px 0 16px; letter-spacing: -0.02em; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 24px 0 10px; }

  /* ---------- TOTALS ---------- */
  .totals { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 20px; }
  .totals .big { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .totals .sub { margin-top: 6px; opacity: 0.85; }

  /* ---------- NEW: CATEGORY BARS ----------
     Each row is: label on top, a track (empty bar), and a fill (colored part).
     JavaScript sets the fill's width as a percentage. */
  .cats { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .cat { margin-bottom: 12px; }
  .cat:last-child { margin-bottom: 0; }
  .cat-top { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
  .cat-top span:last-child { color: var(--muted); }
  .track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 99px; }

  /* ---------- FORM ---------- */
  form {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; display: grid; gap: 12px;
  }
  label { display: grid; gap: 4px; font-size: 0.9rem; color: var(--muted); }
  input, select {
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px; padding: 12px 16px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .buttons { display: grid; gap: 8px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- LIST ---------- */
  .sub-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .sub-item.editing { border-color: var(--accent); border-width: 2px; }
  .sub-item .name { font-weight: 600; }
  .sub-item .meta { font-size: 0.85rem; color: var(--muted); }
  .sub-item .meta.soon { color: var(--warn); font-weight: 600; }
  .sub-item .price { font-weight: 600; text-align: right; white-space: nowrap; }
  .link { background: transparent; padding: 6px 8px; font-size: 0.85rem; }
  .edit { color: var(--accent); }
  .del { color: var(--danger); }
  .empty { color: var(--muted); padding: 16px 0; }
  .error { color: var(--danger); font-size: 0.9rem; min-height: 1.2em; }
</style>
</head>

<body>
<main>
  <h1>Subscription Tracker</h1>

  <section class="totals" aria-live="polite">
    <div class="big" id="monthlyTotal">$0.00</div>
    <div class="sub" id="yearlyTotal">per month · $0.00 per year</div>
  </section>

  <!-- NEW: this whole section is filled in by JavaScript -->
  <h2>Spending by category</h2>
  <div class="cats" id="cats"></div>

  <h2 id="formTitle">Add a subscription</h2>
  <form id="addForm" autocomplete="off">
    <label>Name
      <input id="name" type="text" placeholder="Netflix" maxlength="60" required>
    </label>

    <!-- NEW: category dropdown. The text between <option> tags is what you
         see; the value="" is what gets saved. Add your own options here! -->
    <label>Category
      <select id="category">
        <option value="Streaming">Streaming</option>
        <option value="Music">Music</option>
        <option value="Software">Software</option>
        <option value="Fitness">Fitness</option>
        <option value="Gaming">Gaming</option>
        <option value="Other">Other</option>
      </select>
    </label>

    <div class="row">
      <label>Cost ($)
        <input id="cost" type="number" step="0.01" min="0" max="100000" inputmode="decimal" placeholder="15.99" required>
      </label>
      <label>Billed
        <select id="cycle">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </label>
    </div>
    <label>Next renewal date
      <input id="date" type="date" required>
    </label>
    <div class="error" id="error" role="alert"></div>
    <div class="buttons">
      <button class="primary" type="submit" id="submitBtn">Add subscription</button>
      <!-- NEW: only visible while editing (see startEdit / stopEdit) -->
      <button class="ghost" type="button" id="cancelBtn" hidden>Cancel</button>
    </div>
  </form>

  <h2>Your subscriptions</h2>
  <div id="list"></div>
</main>

<script>
  // ---------- 1. DATA ----------
  // Same storage key as version 1, so your existing subscriptions stay.
  const STORAGE_KEY = "subscriptions-v1";
  let subs = loadSubs();

  // NEW: remembers which subscription we're editing (null = none, adding new)
  let editingId = null;

  function loadSubs() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const list = saved ? JSON.parse(saved) : [];
      // NEW: old entries from version 1 have no category, so give them "Other"
      return list.map(s => ({ ...s, category: s.category || "Other" }));
    } catch (e) {
      return [];
    }
  }

  function saveSubs() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(subs)); } catch (e) {}
  }

  // ---------- 2. HELPERS ----------
  const money = n => "$" + n.toFixed(2);
  const perMonth = s => (s.cycle === "yearly" ? s.cost / 12 : s.cost);

  // Step forward from the first renewal date one billing period at a time.
  // Each step starts again from the ORIGINAL day of the month, and a short
  // month uses its last day: Jan 31 -> Feb 28 -> Mar 31 (not Mar 3, Apr 3...).
  function nextRenewal(s) {
    const start = new Date(s.date + "T00:00:00");
    if (isNaN(start)) return start;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const step = s.cycle === "yearly" ? 12 : 1;
    let d = start;
    for (let months = step; d < today; months += step) {
      const y = start.getFullYear(), m = start.getMonth() + months;
      const lastDay = new Date(y, m + 1, 0).getDate();
      d = new Date(y, m, Math.min(start.getDate(), lastDay));
    }
    return d;
  }

  function daysUntil(d) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
  }

  // Shortcut: find an element by its id
  const $ = id => document.getElementById(id);

  // ---------- 3. DRAWING THE SCREEN ----------
  function render() {
    renderTotals();
    renderCategories();
    renderList();
  }

  function renderTotals() {
    const monthly = subs.reduce((sum, s) => sum + perMonth(s), 0);
    $("monthlyTotal").textContent = money(monthly);
    $("yearlyTotal").textContent = "per month · " + money(monthly * 12) + " per year";
  }

  // NEW: add up the monthly cost for each category, then draw a bar for each.
  function renderCategories() {
    const box = $("cats");
    box.replaceChildren();

    if (subs.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.style.margin = "0";
      p.textContent = "Your category totals will show up here.";
      box.appendChild(p);
      return;
    }

    // totals looks like: { Streaming: 22.5, Software: 9.99 }
    const totals = {};
    for (const s of subs) {
      totals[s.category] = (totals[s.category] || 0) + perMonth(s);
    }

    // Turn it into a list and sort biggest first
    const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    const biggest = rows[0][1]; // the longest bar = the biggest category

    for (const [category, amount] of rows) {
      const wrap = document.createElement("div");
      wrap.className = "cat";

      const top = document.createElement("div");
      top.className = "cat-top";
      const label = document.createElement("span");
      label.textContent = category;
      const value = document.createElement("span");
      value.textContent = money(amount) + "/mo";
      top.append(label, value);

      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.width = (amount / biggest) * 100 + "%"; // bar length
      track.appendChild(fill);

      wrap.append(top, track);
      box.appendChild(wrap);
    }
  }

  function renderList() {
    const list = $("list");
    list.replaceChildren();

    if (subs.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing here yet. Add your first subscription above.";
      list.appendChild(p);
      return;
    }

    const sorted = [...subs].sort((a, b) => nextRenewal(a) - nextRenewal(b));

    for (const s of sorted) {
      const next = nextRenewal(s);
      const days = daysUntil(next);

      const item = document.createElement("div");
      item.className = "sub-item" + (s.id === editingId ? " editing" : "");

      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = s.name;
      const meta = document.createElement("div");
      meta.className = "meta" + (days <= 7 ? " soon" : "");
      meta.textContent =
        s.category + " · " +
        (days === 0 ? "Renews today" : days === 1 ? "Renews tomorrow" : "Renews in " + days + " days");
      left.append(name, meta);

      const right = document.createElement("div");
      right.className = "price";
      right.textContent = money(s.cost) + (s.cycle === "yearly" ? "/yr" : "/mo");

      // NEW: Edit button next to Delete
      const edit = document.createElement("button");
      edit.className = "link edit";
      edit.textContent = "Edit";
      edit.setAttribute("aria-label", "Edit " + s.name);
      edit.addEventListener("click", () => startEdit(s.id));

      const del = document.createElement("button");
      del.className = "link del";
      del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete " + s.name);
      del.addEventListener("click", () => removeSub(s.id));

      right.append(document.createElement("br"), edit, del);
      item.append(left, right);
      list.appendChild(item);
    }
  }

  // ---------- 4. ACTIONS ----------

  // NEW: Edit step 1 - copy the chosen subscription INTO the form
  function startEdit(id) {
    const s = subs.find(x => x.id === id); // find the one with this id
    if (!s) return;
    editingId = id;
    $("name").value = s.name;
    $("category").value = s.category;
    $("cost").value = s.cost;
    $("cycle").value = s.cycle;
    $("date").value = s.date;
    $("formTitle").textContent = "Edit subscription";
    $("submitBtn").textContent = "Save changes";
    $("cancelBtn").hidden = false;
    $("error").textContent = "";
    $("addForm").scrollIntoView({ behavior: "smooth", block: "start" });
    renderList(); // highlights the item being edited
  }

  // NEW: put the form back to "add" mode
  function stopEdit() {
    editingId = null;
    $("addForm").reset();
    $("formTitle").textContent = "Add a subscription";
    $("submitBtn").textContent = "Add subscription";
    $("cancelBtn").hidden = true;
    $("error").textContent = "";
    renderList();
  }

  // The form's Submit button does BOTH jobs: add new, or save an edit.
  function handleSubmit(e) {
    e.preventDefault();

    const name = $("name").value.trim();
    const category = $("category").value;
    const cost = parseFloat($("cost").value);
    const cycle = $("cycle").value;
    const date = $("date").value;

    if (!name || !isFinite(cost) || cost < 0 || cost > 100000 || !date || isNaN(new Date(date + "T00:00:00"))) {
      $("error").textContent = "Enter a name, a cost from 0 to 100,000, and a renewal date.";
      return;
    }

    if (editingId !== null) {
      // NEW: EDIT MODE - replace the old entry's details, keep its id
      subs = subs.map(s =>
        s.id === editingId ? { ...s, name, category, cost, cycle, date } : s
      );
    } else {
      // ADD MODE - make a brand new entry
      subs.push({ id: Date.now(), name, category, cost, cycle, date });
    }

    saveSubs();
    stopEdit(); // resets the form and returns to add mode
    render();
  }

  function removeSub(id) {
    subs = subs.filter(s => s.id !== id);
    if (id === editingId) stopEdit(); // don't keep editing a deleted item
    saveSubs();
    render();
  }

  // ---------- 5. START THE APP ----------
  $("addForm").addEventListener("submit", handleSubmit);
  $("cancelBtn").addEventListener("click", stopEdit);
  render();
</script>
</body>
</html>
